name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

      - run: npm run build:client
      - name: Include Pages Functions
        run: cp -R functions dist/client/functions

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.86.0"
          command: pages deploy dist/client --project-name=phuket-smart-bus --branch=main

      # Pages rejects a ratelimits binding. This worker is the binding,
      # on bus.nonarkara.org/api/research/* only, and it fetches the
      # Pages origin deployed above.
      - name: Deploy research rate-limit gate
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.86.0"
          command: deploy -c wrangler.research.toml
