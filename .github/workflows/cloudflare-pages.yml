name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

      - run: npm run build:client
        env:
          # The GISTDA tile key is a BUILD input. It has to be the same value
          # the local build uses (.env), or the two builds of one commit are
          # two different products — the GISTDA incident layer is compiled
          # out when the key is absent — and scripts/verify-assets.mjs will
          # report the difference. It is a public tile key, not a secret; it
          # is visible in every tile URL the browser requests.
          VITE_GISTDA_API_KEY: ${{ secrets.VITE_GISTDA_API_KEY }}
      - name: Include Pages Functions
        run: cp -R functions dist/client/functions
      - name: Include the 404 shell
        # scripts/deploy.sh copies index.html to 404.html so an unmatched path
        # answers with the SPA shell AND a 404 status. Without it, Pages' SPA
        # mode answers /assets/nope.js with 200 text/html — the shell for a
        # file that does not exist. The local and CI builds of one commit must
        # behave identically, so this step exists in both deploy paths.
        run: cp dist/client/index.html dist/client/404.html

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.86.0"
          command: pages deploy dist/client --project-name=phuket-smart-bus --branch=main

      # Pages rejects a ratelimits binding. This worker is the binding,
      # on bus.nonarkara.org/api/research/* only, and it fetches the
      # Pages origin deployed above.
      - name: Deploy research rate-limit gate
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.86.0"
          command: deploy -c wrangler.research.toml

      # The design gate. The bytes can be perfect and the page can still be
      # wrong: a type token that no scope defines (the declaration is then
      # invalid and silently inherits — this shipped and flattened a whole
      # page to three font sizes), a band that starts on a different line
      # from the bands above it, a rendered size that no token names. None
      # of those is visible to a byte comparison, and all three have shipped.
      # This runs against the site that is LIVE, after the deploy.
      - name: Design gate
        run: |
          npx playwright install --with-deps chromium
          sleep 20
          bash scripts/design/verify-design.sh https://bus.nonarkara.org

      # The policy is ENFORCED (public/_headers, since 2026-10-29), and an
      # enforced policy that blocks a tile layer or a font fails SILENTLY: the
      # page still renders, it just looks wrong, and nothing in the console
      # says why. The sweep is the check that says it does not — every route,
      # both widths, against the site that is LIVE, after the deploy.
      #
      # It is here, after the deploy, because that is the only place the NEW
      # build exists: a sweep in the pull request measures the old build, and
      # the old build is the one that is already known to be clean.
      - name: CSP sweep
        run: |
          node scripts/design/cspsweep.mjs --base https://bus.nonarkara.org
