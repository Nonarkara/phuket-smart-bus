name: CI

on:
  pull_request:
  # The project's own flow is commit-to-main → deploy, so the proofs run
  # there too. A gate that only runs on the pull request is a gate that
  # does not run on the day the site ships.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  # THE PROOFS RUN HERE, NOT ONLY ON SOMEONE'S MACHINE.
  #
  # A rule that is checked only when a human remembers to check it is a
  # number, not a rule. The three instruments below each carry a proof that
  # the instrument CAN fail and CAN stay quiet — and the proof suites are
  # the only thing standing between a green light and a check that has
  # quietly stopped checking anything:
  #
  #   prove-settle  — the shared wait every gate instrument stands on. If it
  #                   returns early, every instrument measures a page that
  #                   is not there.
  #   prove-ship    — the shipability audit, and the debt routing that
  #                   decides whether a finding blocks a deploy.
  #   prove-space   — the spatial-hallucination instrument and its six
  #                   failure modes.
  #   prove-csp     — the Content-Security-Policy sweep: a page that loads
  #                   from an unallowed host fails, a clean page passes, a
  #                   route that is not there is a finding.
  #
  # They need a browser, so the browser is installed here rather than
  # assumed. They are quick — a few minutes — and they are the difference
  # between an instrument and a decoration.
  design:
    runs-on: ubuntu-latest
    # A hung proof must not burn a runner's afternoon.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: The settle waits for a finished page
        run: bash scripts/design/prove-settle.sh
      - name: The shipability audit bites, and stays quiet
        run: bash scripts/design/prove-ship.sh
      - name: The spatial instrument bites, and stays quiet
        run: bash scripts/design/prove-space.sh
      - name: The CSP sweep bites, and stays quiet
        run: node scripts/design/prove-csp.mjs
