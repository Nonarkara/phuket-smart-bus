# Optional GitHub Actions gate. Public repos get Actions minutes free; on private repos
# prefer the local pre-commit hook that `non-slop init` installs (no minutes used).
# Copy to .github/workflows/non-slop.yml to use.
name: non-slop
on: [pull_request]
permissions: { contents: read }
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20 }
      - run: node .non-slop/bin/non-slop.mjs scan . --fail-on slop
