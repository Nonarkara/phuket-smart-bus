<!doctype html>
<!-- non-slop-example: a test fixture, not a product surface. The non-slop scan
     judges real screens; these pages exist to make an instrument fail or stay
     quiet, and they are never seen by a reader. -->

<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>type ramp — the deliberate violation</title>
<style>
  * { box-sizing: border-box; }
  html { font-family: "Source Sans 3", system-ui, sans-serif; }
  body { margin: 0; color: #12211a; background: #faf7f0; }
  section { padding: 24px; }
  /* NINE distinct sizes, none below the floor — so the ONLY law this page
     breaks is the ≤8 ramp law. */
  .s11 { font-size: 11px; }
  .s12 { font-size: 12px; }
  .s13 { font-size: 13px; }
  .s14 { font-size: 14px; }
  .s15 { font-size: 15px; }
  .s16 { font-size: 16px; }
  .s17 { font-size: 17px; }
  .s18 { font-size: 18px; }
  .s19 { font-size: 19px; }
</style>
</head>
<body>
<section>
  <p class="s11">eleven</p>
  <p class="s12">twelve</p>
  <p class="s13">thirteen</p>
  <p class="s14">fourteen</p>
  <p class="s15">fifteen</p>
  <p class="s16">sixteen</p>
  <p class="s17">seventeen</p>
  <p class="s18">eighteen</p>
  <p class="s19">nineteen</p>
</section>
</body>
</html>
